params:
  - id: download_dir
    type: string
    name: "Download Directory"
    description: "Name of the download folder for this instance"
    default_value: "Downloads"
    optional: false
  - id: operator_token
    type: string
    name: "Operator Token"
    description: "API token for operator authentication"
    default_value: $random(len=32)
    optional: false

locales:
  zh:
    download_dir:
      name: "下载目录"
      description: "当前实例的下载文件夹名称"
    operator_token:
      name: "操作员令牌"
      description: "API 操作员认证令牌，用于远程管理接口"