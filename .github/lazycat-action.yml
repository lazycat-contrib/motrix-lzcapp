version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: motrix

build:
  run_buildscript: false

images:
  - id: motrix
    target: service
    service: server
    source: motrixapp/motrix-server
    channel: beta
    tag_regex: '^v?\d+\.\d+\.\d+(-.*)?$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    continue_if_newer_version: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Motrix
    summary: Published from CI