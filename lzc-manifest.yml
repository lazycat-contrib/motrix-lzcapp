application:
  subdomain: motrix
  multi_instance: true
  background_task: true
  upstreams:
    - location: /
      backend: http://server:8080/
  public_path:
    - /
  injects:
    - id: motrix-auto-login
      when:
        - /
      do: |
        (async () => {
          try {
            if (window.__mtx_al__) return;
            window.__mtx_al__ = true;
            const r = await fetch('/rpc/auth/status', { credentials: 'include' });
            const s = await r.json();
            if (s && s.authed) return;
            const lr = await fetch('/rpc/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: '{{.U.operator_token}}' })
            });
            if (lr.ok) location.reload();
          } catch (e) { /* ignore */ }
        })();
services:
  server:
    # motrixapp/motrix-server:2.0.0-beta.19
    # upstream: motrixapp/motrix-server:2.0.0-beta.36
    image: registry.lazycat.cloud/czyt/motrixapp/motrix-server:3de09db51002d36f
    user: root
    environment:
      - MOTRIX_DATA_DIR=/data
      - MOTRIX_TEMP_DIR=/data/tmp
      - MOTRIX_PLUGIN_DIR=/data/plugins
      - MOTRIX_DEFAULT_SAVE_DIR=/downloads
      - MOTRIX_ALLOWED_SAVE_DIRS=/downloads
      - MOTRIX_MDXP_HOST=0.0.0.0
      - MOTRIX_MDXP_PORT=16801
      - MOTRIX_OPERATOR_TOKEN={{.U.operator_token}}
      - MOTRIX_PUBLIC_URL=https://{{.S.AppDomain}}
    binds:
      - /lzcapp/var/data:/data
      - /lzcapp/run/mnt/home/{{.U.download_dir}}:/downloads
ext_config:
  enable_document_access: true
